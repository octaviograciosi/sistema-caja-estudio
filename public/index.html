<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caja del Estudio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Estructura de panel: barra superior oscura, encabezado con cifras, menú lateral y tarjetas sobre gris claro. Azul de Ualá para acciones. */
:root{--bg:#e9edf0;--fg:#1f2326;--card:#fff;--mut:#5f6872;--bd:#d9dee3;--row:#f4f4f4;--row-hover:#e4e8ec;--ac:#0054ea;--ac2:#022a9a;--soft:#e0edff;--soft-fg:#022a9a;--ok:#0f7b4f;--okbg:#dff3e8;--ko:#d6221f;--shell:#082043;--shell2:#051632;--shell-fg:#f2f3f4;--shell-mut:#a9b8d4;--or:#082043}
@media(prefers-color-scheme:dark){:root{--bg:#0b1424;--fg:#eceef0;--card:#111c31;--mut:#9aa3ab;--bd:#223454;--row:#162238;--row-hover:#1e2d4a;--ac:#4591ff;--ac2:#4591ff;--soft:#17306b;--soft-fg:#c7d8fa;--ok:#4cd391;--okbg:#10382a;--ko:#ff7a85;--shell:#061a38;--shell2:#040f23;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ease-out:cubic-bezier(0.23,1,0.32,1)}
body{margin:0;font:14px/1.5 'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.bar{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:24px}
.top{background:var(--shell2);color:var(--shell-fg)}
.top .bar{height:56px;justify-content:space-between}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}.brand i{font-style:normal}
.links{display:flex;gap:4px;align-self:stretch;overflow-x:auto}
.links button{border:0;background:none;border-radius:0;color:var(--shell-mut);padding:0 12px;font-size:13px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.links button.on{color:#fff;font-weight:600;border-bottom-color:#fff}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--shell-mut);white-space:nowrap}
.who button{background:none;border:1px solid #3a5586;color:#fff;border-radius:6px;padding:4px 12px}
.hero{background:var(--shell);color:var(--shell-fg);border-top:1px solid #1d3a6b}
.hero .bar{flex-direction:column;align-items:flex-start;gap:14px;padding-top:22px;padding-bottom:22px}
.hero h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.kpis{display:flex;gap:36px;flex-wrap:wrap}.kpi small{display:block;color:var(--shell-mut);font-size:12px}
.kpi b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr)}
.side{background:var(--shell);color:var(--shell-mut);padding:12px 0;min-height:calc(100vh - 190px)}
.side h4{margin:10px 20px 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.side button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 20px;font-size:13px;border-left:3px solid transparent}
.side button small{display:block;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.side button.on{color:#fff;font-weight:600;border-left-color:#fff}
.main{padding:22px 20px 40px;min-width:0}
.sec{margin:0 0 14px;font-size:18px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,25,30,.06)}
.card h3{margin:0 0 12px;font-size:15px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button,input,select{font:inherit;padding:8px 11px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
input:focus,select:focus{border-color:var(--ac)}
button{cursor:pointer;font-weight:500;touch-action:manipulation;transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,color 150ms ease}
button:active{transform:scale(0.97)}
input,select{transition:border-color 150ms ease}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600;padding:9px 20px}
table{width:100%;border-collapse:collapse}th{font-size:11px !important;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
th,td{padding:8px 6px;font-size:13px;border-bottom:1px solid var(--bd);text-align:left}
tbody tr:nth-child(even){background:var(--row)}
td button{padding:3px 8px}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.in{color:var(--ok);font-weight:600}.eg{color:var(--ko);font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill{display:inline-block;background:var(--soft);color:var(--soft-fg);border-radius:10px;padding:1px 9px;font-size:12px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 150px}.row label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
.mut{color:var(--mut)}.tw{overflow-x:auto}
.lista{max-height:420px;overflow:auto}.lista thead th{position:sticky;top:0;background:var(--card)}
.cuenta{max-width:460px;margin:14px 0 0 auto}.cuenta td,.cuenta th{border-bottom:1px solid var(--bd);padding:6px}.cuenta tbody tr:nth-child(even){background:none}
@media(hover:hover) and (pointer:fine){.links button:hover,.side button:hover{color:#fff}button.p:hover{background:var(--ac2);border-color:var(--ac2)}tbody tr:hover{background:var(--row-hover)}}
@media(pointer:coarse){td button{padding:9px 13px}.links button,.side button{min-height:44px}.who button{padding:9px 14px}}
@media(prefers-reduced-motion:reduce){button{transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease}button:active{transform:none}}
.login{max-width:380px;margin:12vh auto 0}.login h2{font-size:22px;margin:0 0 12px}
#app>.card:not(.login){margin:16px}
@media(max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{min-height:0;padding:0;display:flex;overflow-x:auto}.side h4{display:none}
  .side button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:10px 16px}
  .side button.on{border-bottom-color:#fff}
  .top .bar{flex-wrap:wrap;height:auto;gap:0 12px;padding:10px 12px 0}.links{order:3;width:100%;margin:0 -4px}.links button{padding:12px 12px}.who span{display:none}.main{padding:16px 12px 32px}
  .hero .bar{padding-left:16px;padding-right:16px}.kpis{gap:20px 28px}
}
</style></head><body><main id="app"></main>
<script>
const $=(s)=>document.querySelector(s), app=$('#app');
const fmt=(c)=>(c/100).toLocaleString('es-AR',{style:'currency',currency:'ARS'});
const api=async(u,o={})=>{const r=await fetch('/api'+u,{headers:{'Content-Type':'application/json'},...o,body:o.body&&JSON.stringify(o.body)});
  const d=await r.json().catch(()=>({}));if(r.status===401&&u!=='/login'){return login()}if(!r.ok)throw new Error(d.error||r.status);return d};
const esc=(s)=>String(s??'').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let aviso='',filas=[],editId=null,cajas=[],cats=[],cajaId=null,vista='mov',yo=null;

async function login(){
  const {hayUsuarios}=await (await fetch('/api/estado')).json();
  app.innerHTML=`<div class="card login"><div class="brand" style="margin-bottom:10px">Caja<i>·</i>Estudio</div><h2>${hayUsuarios?'Ingresar':'Crear primer usuario'}</h2>
  <p><input id="u" placeholder="Usuario" style="width:100%;box-sizing:border-box"></p>
  <p><input id="p" type="password" placeholder="Contraseña (mín. 6)" style="width:100%;box-sizing:border-box"></p>
  <p id="err" class="eg"></p><button class="p" id="go">${hayUsuarios?'Entrar':'Crear y entrar'}</button></div>`;
  $('#go').onclick=async()=>{const b={nombre:$('#u').value,password:$('#p').value};
    try{if(!hayUsuarios)await api('/usuarios',{method:'POST',body:b});await api('/login',{method:'POST',body:b});init()}
    catch(e){$('#err').textContent=e.message}};
}
async function init(){yo=await api('/me');if(!yo)return;if(yo.rol!=='admin'&&!['cierre','rend'].includes(vista))vista='cierre';cajas=await api('/cajas');cats=await api('/categorias');cajaId=cajas.some(x=>x.id===cajaId)?cajaId:cajas[0]?.id;render()}
function render(){
  const c=cajas.find(x=>x.id===cajaId);
  if(!c&&vista!=='usr')return app.innerHTML='<div class="card">No tenés cajas asignadas. Pedile acceso al administrador. <button id="out">Salir</button></div>',$('#out').onclick=salir;
  const TABS=yo.rol==='admin'?[['mov','Movimientos'],['cierre','Cierre de caja'],['rend','Rendiciones'],['rep','Gastos por mes'],['usr','Usuarios']]:[['cierre','Cierre de caja'],['rend','Rendiciones']];
  const kp=(l,v)=>`<div class="kpi"><small>${l}</small><b>${v}</b></div>`;
  app.innerHTML=`<header class="top"><div class="bar"><div class="brand">Caja<i>·</i>Estudio</div>
  <nav class="links">${TABS.map(([k,l])=>`<button class="${vista===k?'on':''}" data-v="${k}">${l}</button>`).join('')}</nav>
  <div class="who"><span>${esc(yo.nombre)} · ${yo.rol}</span><button id="out">Salir</button></div></div></header>
  <section class="hero"><div class="bar"><h1>${c?'Caja '+esc(c.nombre):'Usuarios'}</h1>${c?`<div class="kpis">${kp('Saldo',fmt(c.saldo))}${yo.rol==='admin'?kp('Ingresos del mes',fmt(c.ingresos_mes))+kp('Gastos del mes',fmt(c.gastos_mes))+kp('Movimientos',c.movimientos.toLocaleString('es-AR')):''}</div>`:''}</div></section>
  <div class="shell"><aside class="side"><h4>Cajas</h4>${cajas.map(x=>`<button class="${x.id===cajaId?'on':''}" data-c="${x.id}">${esc(x.nombre)}<small>${fmt(x.saldo)}</small></button>`).join('')}</aside>
  <div class="main"><h2 class="sec">${TABS.find(t=>t[0]===vista)[1]}</h2><div id="vista"></div></div></div>`;
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cajaId=+b.dataset.c;render()});
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{vista=b.dataset.v;render()});
  $('#out').onclick=salir;
  ({mov:vMov,cierre:vCierre,rend:vRend,rep:vRep,usr:vUsr})[vista](c);
}
async function vMov(c){
  const hoy=new Date().toISOString().slice(0,10);
  $('#vista').innerHTML=`<div class="card"><div class="row">
   <label>Fecha<input type="date" id="f" value="${hoy}"></label>
   <label>Tipo<select id="t"><option value="1">Ingreso</option><option value="-1">Egreso</option></select></label>
   <label style="flex:3 1 240px">Concepto<input id="c" style="width:100%;box-sizing:border-box"></label>
   <label>Importe ($)<input id="i" inputmode="decimal"></label>
   <label>Tipo de egreso<select id="k"><option value="">—</option>${cats.map(k=>`<option value="${k.id}">${esc(k.nombre)}</option>`).join('')}</select></label>
   <button class="p" id="add">Agregar</button></div><p id="err" class="eg"></p></div>
   <div class="card"><div class="row"><input id="q" placeholder="Buscar concepto…"><label>Desde<input type="date" id="d"></label><label>Hasta<input type="date" id="h"></label></div>
   <div class="tw"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo egreso</th><th class="n">Ingreso</th><th class="n">Egreso</th><th class="n">Saldo</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
  const load=async()=>{const p=new URLSearchParams({q:$('#q').value,desde:$('#d').value,hasta:$('#h').value});
    const rows=await api(`/cajas/${c.id}/movimientos?${p}`);
    $('#tb').innerHTML=rows.map(r=>`<tr><td>${r.fecha.split('-').reverse().join('/')}</td><td>${esc(r.concepto)}</td><td>${r.categoria?`<span class="pill">${esc(r.categoria)}</span>`:''}</td>
     <td class="n in">${r.importe>0?fmt(r.importe):''}</td><td class="n eg">${r.importe<0?fmt(-r.importe):''}</td><td class="n">${fmt(r.saldo)}</td>
     <td style="white-space:nowrap">${yo.rol==='admin'?`<button data-e="${r.id}" title="Editar">✎</button> <button data-x="${r.id}" title="Eliminar">✕</button>`:''}</td></tr>`).join('');
    filas=rows;
    $('#tb').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const r=filas.find(x=>x.id==b.dataset.e);editId=r.id;
      $('#f').value=r.fecha;$('#t').value=r.importe>0?'1':'-1';$('#c').value=r.concepto;$('#i').value=String(Math.abs(r.importe)/100).replace('.',',');
      $('#k').value=r.categoria_id||'';$('#add').textContent='Guardar cambios';scrollTo(0,0)});
    $('#tb').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar movimiento?')){await api('/movimientos/'+b.dataset.x,{method:'DELETE'});cajas=await api('/cajas');render()}})};
  ['q','d','h'].forEach(i=>$('#'+i).oninput=load);
  $('#add').onclick=async()=>{try{
    const n=Math.round(parseFloat($('#i').value.replace(/\./g,'').replace(',','.'))*100);
    if(!n||n<0)throw new Error('Importe inválido');const s=+$('#t').value;
    const body={fecha:$('#f').value,concepto:$('#c').value,importe:n*s,categoria_id:s<0&&$('#k').value?+$('#k').value:null};
    if(editId){await api('/movimientos/'+editId,{method:'PUT',body});editId=null}else await api(`/cajas/${c.id}/movimientos`,{method:'POST',body});
    cajas=await api('/cajas');render()}catch(e){$('#err').textContent=e.message}};
  load();
}
async function vCierre(c){
  const hoy=new Date().toISOString().slice(0,10),h=await api(`/cajas/${c.id}/cierres`);
  $('#vista').innerHTML=`<div class="card"><h3>Cerrar caja ${esc(c.nombre)}</h3><div class="row"><label>Fecha<input type="date" id="f" value="${hoy}"></label>
   <label>Efectivo contado ($)<input id="s" inputmode="decimal"></label><button class="p" id="go">Cerrar</button></div><p id="res"></p></div>
   <div class="card"><table><thead><tr><th>Fecha</th><th class="n">Sistema</th><th class="n">Contado</th><th class="n">Diferencia</th></tr></thead><tbody>
   ${h.map(x=>`<tr><td>${x.fecha.split('-').reverse().join('/')}</td><td class="n">${fmt(x.saldo_sistema)}</td><td class="n">${fmt(x.saldo_contado)}</td><td class="n ${x.saldo_contado-x.saldo_sistema?'eg':'in'}">${fmt(x.saldo_contado-x.saldo_sistema)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#go').onclick=async()=>{try{const r=await api(`/cajas/${c.id}/cierres`,{method:'POST',body:{fecha:$('#f').value,saldo_contado:Math.round(parseFloat($('#s').value.replace(/\./g,'').replace(',','.'))*100)}});
    $('#res').textContent=`Sistema ${fmt(r.saldo_sistema)} · Contado ${fmt(r.saldo_contado)} · Diferencia ${fmt(r.diferencia)}`;vCierre(c)}catch(e){$('#res').textContent=e.message}};
}
async function vRend(c){
  const [h,pv]=await Promise.all([api(`/cajas/${c.id}/rendiciones`),api(`/cajas/${c.id}/rendicion/preview`)]);
  const av=aviso;aviso='';
  const nom=c.nombre.toLowerCase(),neto=pv.total_ingresos-pv.total_egresos,sug=neto>0&&neto<=pv.saldo?neto:pv.saldo;
  const num=(v)=>String(v/100).replace('.',','),parse=(t)=>Math.round(parseFloat(t.replace(/\./g,'').replace(',','.'))*100);
  const f=(d)=>d.split('-').reverse().join('/');
  const desde=pv.desde?'la última rendición ('+f(pv.desde)+')':'el inicio';
  $('#vista').innerHTML=av+`<div class="card"><h3>Operaciones que componen la rendición</h3>
   <p class="mut">Movimientos desde ${desde}. Son los mismos que van detallados en el email.</p>
   <div class="tw lista"><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="n">Ingreso</th><th class="n">Egreso</th></tr></thead><tbody>
   ${pv.movimientos.map(m=>`<tr><td>${f(m.fecha)}</td><td>${esc(m.concepto)}</td><td class="n in">${m.importe>0?fmt(m.importe):''}</td><td class="n eg">${m.importe<0?fmt(-m.importe):''}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">No hay movimientos desde la última rendición.</td></tr>'}</tbody></table></div>
   ${pv.truncado?'<p class="mut">Se muestran los últimos 500 movimientos del período.</p>':''}
   <table class="cuenta"><tbody><tr><td>Saldo anterior ${pv.desde?'a la última rendición':'(inicio)'}</td><td class="n">${fmt(pv.saldo_anterior)}</td></tr>
   <tr><td>+ Cobros del período (${pv.n_ingresos})</td><td class="n in">${fmt(pv.total_ingresos)}</td></tr>
   <tr><td>− Egresos del período (${pv.n_egresos})</td><td class="n eg">${fmt(pv.total_egresos)}</td></tr>
   <tr><th>= Saldo actual de la caja</th><th class="n">${fmt(pv.saldo)}</th></tr></tbody></table></div>
   <div class="card"><h3>Realizar rendición de ${esc(nom)}</h3>
   <p class="mut">Registra el retiro en la caja y envía un email automático con el detalle a: <b>${pv.destinatarios.map(esc).join(', ')||'(sin destinatarios configurados)'}</b>. Respondé "recibido" a ese email para dejar constancia.</p>
   <div class="row"><label>Importe a rendir ($)<input id="ri" inputmode="decimal" value="${num(sug)}"></label>
   <label style="flex:2 1 220px">Nota (opcional)<input id="rn" maxlength="200" placeholder="Ej.: semana del 26/10"></label></div>
   <p><button id="r1">Movimientos del período</button> <button id="r2">Todo el saldo</button></p>
   <p id="rm" class="eg" role="status"></p><button class="p" id="rgo">Enviar rendición</button></div>
   <div class="card"><h3>Rendiciones enviadas</h3><div class="tw"><table><thead><tr><th>Fecha</th><th class="n">Importe</th><th>Enviada a</th><th>Registró</th><th>Estado</th><th></th></tr></thead><tbody>
   ${h.map(r=>`<tr><td>${f(r.fecha)}</td><td class="n">${fmt(r.importe)}</td><td class="mut">${esc(r.enviada_a)}</td><td>${esc(r.usuario||'')}</td>
   <td><span class="pill ${r.estado==='recibida'?'ok':''}">${r.estado==='recibida'?'Recibida':'Enviada'}</span></td>
   <td>${yo.rol==='admin'&&r.estado==='enviada'?`<button data-ok="${r.id}">Marcar recibida</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Todavía no hay rendiciones registradas desde el sistema.</td></tr>'}</tbody></table></div></div>`;
  $('#r1').onclick=()=>$('#ri').value=num(neto>0&&neto<=pv.saldo?neto:pv.saldo);$('#r2').onclick=()=>$('#ri').value=num(pv.saldo);
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{await api('/rendiciones/'+b.dataset.ok+'/recibida',{method:'POST'});vRend(c)});
  let pendiente=false;const go=$('#rgo'),msg=$('#rm');
  $('#ri').oninput=()=>{pendiente=false;go.textContent='Enviar rendición';msg.textContent=''};
  go.onclick=async()=>{const imp=parse($('#ri').value);
    if(!imp||imp<=0)return msg.textContent='Ingresá un importe válido.';
    if(!pendiente){pendiente=true;go.textContent='Confirmar y enviar';msg.className='mut';return msg.textContent=`Se enviará el email con las ${pv.movimientos.length} operaciones y se retirarán ${fmt(imp)} de la caja. Tocá de nuevo para confirmar.`}
    go.disabled=true;msg.className='mut';msg.textContent='Enviando…';
    try{const r=await api(`/cajas/${c.id}/rendicion`,{method:'POST',body:{importe:imp,nota:$('#rn').value}});
      aviso=`<div class="card" role="status"><span class="pill ok">Enviada</span> Rendición registrada y email enviado a ${r.enviada_a.map(esc).join(', ')}.</div>`;cajas=await api('/cajas');render()}
    catch(e){go.disabled=false;pendiente=false;go.textContent='Enviar rendición';msg.className='eg';msg.textContent=e.message}};
}
async function vRep(c){
  const d=await api('/reportes/gastos-por-mes?caja_id='+c.id),meses=[...new Set(d.map(x=>x.mes))].sort().reverse().slice(0,12),k=[...new Set(d.map(x=>x.categoria))];
  const v=(m,t)=>d.find(x=>x.mes===m&&x.categoria===t)?.total||0;
  $('#vista').innerHTML=`<div class="card tw"><h3>Gastos por mes — ${esc(c.nombre)}</h3><table><thead><tr><th>Tipo</th>${meses.map(m=>`<th class="n">${m}</th>`).join('')}</tr></thead><tbody>
  ${k.map(t=>`<tr><td>${esc(t)}</td>${meses.map(m=>`<td class="n">${v(m,t)?fmt(v(m,t)):''}</td>`).join('')}</tr>`).join('')}
  <tr><th>Total</th>${meses.map(m=>`<th class="n">${fmt(k.reduce((a,t)=>a+v(m,t),0))}</th>`).join('')}</tr></tbody></table></div>`;
}
async function salir(){await api('/logout',{method:'POST'}).catch(()=>{});location.reload()}
async function vUsr(){
  const us=await api('/usuarios');
  $('#vista').innerHTML=`<div class="card"><h3>Usuarios</h3><div class="tw"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Cajas</th><th></th></tr></thead><tbody>
  ${us.map(u=>`<tr><td>${esc(u.nombre)}</td><td><select data-r="${u.id}"><option ${u.rol==='operador'?'selected':''}>operador</option><option ${u.rol==='admin'?'selected':''}>admin</option></select></td>
  <td>${cajas.map(c=>`<label><input type="checkbox" data-k="${u.id}" value="${c.id}" ${u.cajas.includes(c.id)?'checked':''}> ${esc(c.nombre)}</label> `).join('')}</td>
  <td><button data-s="${u.id}">Guardar</button> <button data-p="${u.id}">Nueva clave</button></td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h3>Agregar usuario</h3><div class="row"><input id="n" placeholder="Usuario"><input id="pw" type="password" placeholder="Contraseña (mín. 6)">
  <select id="ro"><option>operador</option><option>admin</option></select><button class="p" id="nu">Crear</button></div>
  <p class="mut">Los operadores pueden cargar movimientos y cerrar caja sólo en las cajas asignadas; no eliminan ni administran usuarios.</p><p id="err" class="eg"></p></div>
  <div class="card"><h3>Respaldo</h3><a href="/api/respaldo"><button>Descargar copia de la base</button></a></div>`;
  const run=async(f)=>{try{await f();vUsr()}catch(e){$('#err').textContent=e.message}};
  $('#nu').onclick=()=>run(async()=>{await api('/usuarios',{method:'POST',body:{nombre:$('#n').value,password:$('#pw').value,rol:$('#ro').value}})});
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>run(()=>{const id=b.dataset.s;
    return api('/usuarios/'+id,{method:'PUT',body:{rol:document.querySelector(`[data-r="${id}"]`).value,cajas:[...document.querySelectorAll(`[data-k="${id}"]:checked`)].map(x=>+x.value)}})}));
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>run(async()=>{const pw=prompt('Nueva contraseña (mín. 6):');if(pw)await api('/usuarios/'+b.dataset.p,{method:'PUT',body:{password:pw}})}));
}
init().catch(login);
</script></body></html>
