<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caja del Estudio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Paleta tomada de uala.com.ar: azul 0054ea, marinos 022a9a/00073a, neutros azulados */
:root{--bg:#f7f8fb;--fg:#1f1f1f;--card:#fff;--mut:#6b6f81;--bd:#dadee6;--row:#f2f3f6;--ac:#0054ea;--ac2:#022a9a;--soft:#e0edff;--soft-fg:#022a9a;--ok:#0f7b4f;--ko:#e3131a;--hero1:#022a9a;--hero2:#0054ea;--pink:#ff5c98}
@media(prefers-color-scheme:dark){:root{--bg:#00073a;--fg:#f2f3f6;--card:#0b1458;--mut:#a4bff8;--bd:#1d2a78;--row:#0f1a66;--ac:#4591ff;--ac2:#4591ff;--soft:#172584;--soft-fg:#c7d8fa;--ok:#4cd391;--ko:#ff7a85;--hero1:#091252;--hero2:#162dce;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;font:15px/1.5 'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{padding:0 0 40px}.w{max-width:1060px;margin:0 auto;padding:0 16px}#app>.card:not(.login){margin:16px}
.band{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff}
.band .bin{max-width:1060px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em}.brand i{font-style:normal;color:var(--pink)}
.who{display:flex;align-items:center;gap:10px;font-size:14px}.who span{opacity:.85}
.cajas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.caja{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:16px 18px;display:block}
.caja small{display:block;color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.caja b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.caja.on{background:linear-gradient(135deg,var(--hero1),var(--hero2));border-color:transparent;color:#fff}.caja.on small{color:#c7d8fa}
.caja:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--bd);margin-bottom:16px}
.tabs button{border:0;background:none;border-radius:0;padding:10px 14px;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:16px}
h2,h3{margin:0 0 12px;letter-spacing:-.01em}
button,input,select{font:inherit;padding:9px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg)}
input:focus,select:focus{border-color:var(--ac)}
button{cursor:pointer;font-weight:600}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);border-radius:999px;padding:10px 22px}button.p:hover{background:var(--ac2)}
.band button{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35);border-radius:999px;padding:6px 14px}
table{width:100%;border-collapse:collapse}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left}tbody tr:nth-child(even){background:var(--row)}
td button{padding:4px 9px;border-radius:9px}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.in{color:var(--ok);font-weight:600}.eg{color:var(--ko);font-weight:600}
.pill{display:inline-block;background:var(--soft);color:var(--soft-fg);border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 150px}.row label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mut)}
.mut{color:var(--mut)}.tw{overflow-x:auto}
.login{max-width:380px;margin:12vh auto 0}.login h2{font-size:24px}
</style></head><body><main id="app"></main>
<script>
const $=(s)=>document.querySelector(s), app=$('#app');
const fmt=(c)=>(c/100).toLocaleString('es-AR',{style:'currency',currency:'ARS'});
const api=async(u,o={})=>{const r=await fetch('/api'+u,{headers:{'Content-Type':'application/json'},...o,body:o.body&&JSON.stringify(o.body)});
  const d=await r.json().catch(()=>({}));if(r.status===401&&u!=='/login'){return login()}if(!r.ok)throw new Error(d.error||r.status);return d};
const esc=(s)=>String(s??'').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let filas=[],editId=null,cajas=[],cats=[],cajaId=null,vista='mov',yo=null;

async function login(){
  const {hayUsuarios}=await (await fetch('/api/estado')).json();
  app.innerHTML=`<div class="card login"><div class="brand" style="color:var(--ac);margin-bottom:6px">Caja<i>del</i>Estudio</div><h2>${hayUsuarios?'Ingresar':'Crear primer usuario'}</h2>
  <p><input id="u" placeholder="Usuario" style="width:100%;box-sizing:border-box"></p>
  <p><input id="p" type="password" placeholder="Contraseña (mín. 6)" style="width:100%;box-sizing:border-box"></p>
  <p id="err" class="eg"></p><button class="p" id="go">${hayUsuarios?'Entrar':'Crear y entrar'}</button></div>`;
  $('#go').onclick=async()=>{const b={nombre:$('#u').value,password:$('#p').value};
    try{if(!hayUsuarios)await api('/usuarios',{method:'POST',body:b});await api('/login',{method:'POST',body:b});init()}
    catch(e){$('#err').textContent=e.message}};
}
async function init(){yo=await api('/me');if(!yo)return;cajas=await api('/cajas');cats=await api('/categorias');cajaId=cajas.some(x=>x.id===cajaId)?cajaId:cajas[0]?.id;render()}
function render(){
  const c=cajas.find(x=>x.id===cajaId);
  if(!c&&vista!=='usr')return app.innerHTML='<div class="card">No tenés cajas asignadas. Pedile acceso al administrador. <button id="out">Salir</button></div>',$('#out').onclick=salir;
  app.innerHTML=`<div class="band"><div class="bin"><div class="brand">Caja<i>·</i>Estudio</div><div class="who"><span>${esc(yo.nombre)} · ${yo.rol}</span><button id="out">Salir</button></div></div></div>
  <div class="w"><div class="cajas">${cajas.map(x=>`<button class="caja ${x.id===cajaId?'on':''}" data-c="${x.id}"><small>Caja ${esc(x.nombre)}</small><b>${fmt(x.saldo)}</b></button>`).join('')}</div>
  <div class="tabs">${[['mov','Movimientos'],['cierre','Cierre de caja'],['rep','Gastos por mes'],...(yo.rol==='admin'?[['usr','Usuarios']]:[])].map(([k,l])=>`<button class="${vista===k?'on':''}" data-v="${k}">${l}</button>`).join('')}</div><div id="vista"></div></div>`;
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cajaId=+b.dataset.c;render()});
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{vista=b.dataset.v;render()});
  $('#out').onclick=salir;
  ({mov:vMov,cierre:vCierre,rep:vRep,usr:vUsr})[vista](c);
}
async function vMov(c){
  const hoy=new Date().toISOString().slice(0,10);
  $('#vista').innerHTML=`<div class="card"><div class="row">
   <label>Fecha<input type="date" id="f" value="${hoy}"></label>
   <label>Tipo<select id="t"><option value="1">Ingreso</option><option value="-1">Egreso</option></select></label>
   <label style="flex:3 1 240px">Concepto<input id="c" style="width:100%;box-sizing:border-box"></label>
   <label>Importe ($)<input id="i" inputmode="decimal"></label>
   <label>Tipo de egreso<select id="k"><option value="">—</option>${cats.map(k=>`<option value="${k.id}">${esc(k.nombre)}</option>`).join('')}</select></label>
   <button class="p" id="add">Agregar</button></div><p id="err" class="eg"></p></div>
   <div class="card"><div class="row"><input id="q" placeholder="Buscar concepto…"><label>Desde<input type="date" id="d"></label><label>Hasta<input type="date" id="h"></label></div>
   <div class="tw"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo egreso</th><th class="n">Ingreso</th><th class="n">Egreso</th><th class="n">Saldo</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
  const load=async()=>{const p=new URLSearchParams({q:$('#q').value,desde:$('#d').value,hasta:$('#h').value});
    const rows=await api(`/cajas/${c.id}/movimientos?${p}`);
    $('#tb').innerHTML=rows.map(r=>`<tr><td>${r.fecha.split('-').reverse().join('/')}</td><td>${esc(r.concepto)}</td><td>${r.categoria?`<span class="pill">${esc(r.categoria)}</span>`:''}</td>
     <td class="n in">${r.importe>0?fmt(r.importe):''}</td><td class="n eg">${r.importe<0?fmt(-r.importe):''}</td><td class="n">${fmt(r.saldo)}</td>
     <td style="white-space:nowrap">${yo.rol==='admin'?`<button data-e="${r.id}" title="Editar">✎</button> <button data-x="${r.id}" title="Eliminar">✕</button>`:''}</td></tr>`).join('');
    filas=rows;
    $('#tb').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const r=filas.find(x=>x.id==b.dataset.e);editId=r.id;
      $('#f').value=r.fecha;$('#t').value=r.importe>0?'1':'-1';$('#c').value=r.concepto;$('#i').value=String(Math.abs(r.importe)/100).replace('.',',');
      $('#k').value=r.categoria_id||'';$('#add').textContent='Guardar cambios';scrollTo(0,0)});
    $('#tb').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar movimiento?')){await api('/movimientos/'+b.dataset.x,{method:'DELETE'});cajas=await api('/cajas');render()}})};
  ['q','d','h'].forEach(i=>$('#'+i).oninput=load);
  $('#add').onclick=async()=>{try{
    const n=Math.round(parseFloat($('#i').value.replace(/\./g,'').replace(',','.'))*100);
    if(!n||n<0)throw new Error('Importe inválido');const s=+$('#t').value;
    const body={fecha:$('#f').value,concepto:$('#c').value,importe:n*s,categoria_id:s<0&&$('#k').value?+$('#k').value:null};
    if(editId){await api('/movimientos/'+editId,{method:'PUT',body});editId=null}else await api(`/cajas/${c.id}/movimientos`,{method:'POST',body});
    cajas=await api('/cajas');render()}catch(e){$('#err').textContent=e.message}};
  load();
}
async function vCierre(c){
  const hoy=new Date().toISOString().slice(0,10),h=await api(`/cajas/${c.id}/cierres`);
  $('#vista').innerHTML=`<div class="card"><h3>Cerrar caja ${esc(c.nombre)}</h3><div class="row"><label>Fecha<input type="date" id="f" value="${hoy}"></label>
   <label>Efectivo contado ($)<input id="s" inputmode="decimal"></label><button class="p" id="go">Cerrar</button></div><p id="res"></p></div>
   <div class="card"><table><thead><tr><th>Fecha</th><th class="n">Sistema</th><th class="n">Contado</th><th class="n">Diferencia</th></tr></thead><tbody>
   ${h.map(x=>`<tr><td>${x.fecha.split('-').reverse().join('/')}</td><td class="n">${fmt(x.saldo_sistema)}</td><td class="n">${fmt(x.saldo_contado)}</td><td class="n ${x.saldo_contado-x.saldo_sistema?'eg':'in'}">${fmt(x.saldo_contado-x.saldo_sistema)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#go').onclick=async()=>{try{const r=await api(`/cajas/${c.id}/cierres`,{method:'POST',body:{fecha:$('#f').value,saldo_contado:Math.round(parseFloat($('#s').value.replace(/\./g,'').replace(',','.'))*100)}});
    $('#res').textContent=`Sistema ${fmt(r.saldo_sistema)} · Contado ${fmt(r.saldo_contado)} · Diferencia ${fmt(r.diferencia)}`;vCierre(c)}catch(e){$('#res').textContent=e.message}};
}
async function vRep(c){
  const d=await api('/reportes/gastos-por-mes?caja_id='+c.id),meses=[...new Set(d.map(x=>x.mes))].sort().reverse().slice(0,12),k=[...new Set(d.map(x=>x.categoria))];
  const v=(m,t)=>d.find(x=>x.mes===m&&x.categoria===t)?.total||0;
  $('#vista').innerHTML=`<div class="card tw"><h3>Gastos por mes — ${esc(c.nombre)}</h3><table><thead><tr><th>Tipo</th>${meses.map(m=>`<th class="n">${m}</th>`).join('')}</tr></thead><tbody>
  ${k.map(t=>`<tr><td>${esc(t)}</td>${meses.map(m=>`<td class="n">${v(m,t)?fmt(v(m,t)):''}</td>`).join('')}</tr>`).join('')}
  <tr><th>Total</th>${meses.map(m=>`<th class="n">${fmt(k.reduce((a,t)=>a+v(m,t),0))}</th>`).join('')}</tr></tbody></table></div>`;
}
async function salir(){await api('/logout',{method:'POST'}).catch(()=>{});location.reload()}
async function vUsr(){
  const us=await api('/usuarios');
  $('#vista').innerHTML=`<div class="card"><h3>Usuarios</h3><div class="tw"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Cajas</th><th></th></tr></thead><tbody>
  ${us.map(u=>`<tr><td>${esc(u.nombre)}</td><td><select data-r="${u.id}"><option ${u.rol==='operador'?'selected':''}>operador</option><option ${u.rol==='admin'?'selected':''}>admin</option></select></td>
  <td>${cajas.map(c=>`<label><input type="checkbox" data-k="${u.id}" value="${c.id}" ${u.cajas.includes(c.id)?'checked':''}> ${esc(c.nombre)}</label> `).join('')}</td>
  <td><button data-s="${u.id}">Guardar</button> <button data-p="${u.id}">Nueva clave</button></td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h3>Agregar usuario</h3><div class="row"><input id="n" placeholder="Usuario"><input id="pw" type="password" placeholder="Contraseña (mín. 6)">
  <select id="ro"><option>operador</option><option>admin</option></select><button class="p" id="nu">Crear</button></div>
  <p class="mut">Los operadores pueden cargar movimientos y cerrar caja sólo en las cajas asignadas; no eliminan ni administran usuarios.</p><p id="err" class="eg"></p></div>
  <div class="card"><h3>Respaldo</h3><a href="/api/respaldo"><button>Descargar copia de la base</button></a></div>`;
  const run=async(f)=>{try{await f();vUsr()}catch(e){$('#err').textContent=e.message}};
  $('#nu').onclick=()=>run(async()=>{await api('/usuarios',{method:'POST',body:{nombre:$('#n').value,password:$('#pw').value,rol:$('#ro').value}})});
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>run(()=>{const id=b.dataset.s;
    return api('/usuarios/'+id,{method:'PUT',body:{rol:document.querySelector(`[data-r="${id}"]`).value,cajas:[...document.querySelectorAll(`[data-k="${id}"]:checked`)].map(x=>+x.value)}})}));
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>run(async()=>{const pw=prompt('Nueva contraseña (mín. 6):');if(pw)await api('/usuarios/'+b.dataset.p,{method:'PUT',body:{password:pw}})}));
}
init().catch(login);
</script></body></html>
